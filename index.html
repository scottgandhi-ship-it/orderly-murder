<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Most Orderly Murder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1a1d2a;
  --ink-2: #232738;
  --ink-3: #2b3044;
  --gold: #c9a34e;
  --gold-2: #e0c47a;
  --gold-dim: #8f7642;
  --paper: #efe4c8;
  --paper-2: #e2d3ae;
  --text: #e9dfc6;
  --text-dim: #a99f8a;
  --blood: #a8322a;
  --ok: #4f8a5b;
  --wall: #2a2418;
  --display: "Abril Fatface", Georgia, "Times New Roman", serif;
  --deco: "Courier Prime", "Courier New", monospace;
  --serif: "Libre Baskerville", Georgia, "Times New Roman", serif;
  --type: "Courier Prime", "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--ink);
  background-image:
    radial-gradient(ellipse at top, rgba(201,162,74,.10), transparent 60%),
    repeating-linear-gradient(135deg, rgba(255,255,255,.012) 0 2px, transparent 2px 14px);
  color: var(--text);
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  /* viewport-fit=cover lets the page run under a notch when the phone is on its side */
  padding: 0 env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px);
}
button { font: inherit; color: inherit; cursor: pointer; }
.screen { display: none; min-height: 100vh; }
.screen.active { display: block; }

/* ---------- deco frame bits ---------- */
.deco-rule { display: flex; align-items: center; gap: 12px; color: var(--gold); justify-content: center; }
.deco-rule::before, .deco-rule::after { content: ""; height: 1px; flex: 1; max-width: 160px;
  background: linear-gradient(90deg, transparent, var(--gold)); }
.deco-rule::after { background: linear-gradient(90deg, var(--gold), transparent); }
.btn {
  background: transparent; border: 1px solid var(--gold); color: var(--gold-2);
  font-family: var(--deco); font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  padding: 11px 20px; font-size: 14px; transition: background .15s, color .15s;
  position: relative;
}
.btn:focus-visible { background: var(--gold); color: var(--ink); outline: none; }
.btn.primary { background: var(--gold); color: var(--ink); }
/* a touch screen keeps :hover on the last button tapped, which would look the same as a pressed Draft or Cross out */
@media (hover: hover) {
  .btn:hover { background: var(--gold); color: var(--ink); }
  .btn.primary:hover { background: var(--gold-2); }
}
.btn.small { padding: 6px 12px; font-size: 13px; letter-spacing: .1em; }
.btn[aria-pressed="true"] { background: var(--gold); color: var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }

/* ---------- title ---------- */
#title { display: none; text-align: center; padding: 8vh 16px 40px; }
#title.active { display: flex; flex-direction: column; align-items: center; }
.sunburst {
  width: 160px; height: 80px; margin-bottom: 18px;
  background: repeating-conic-gradient(from 270deg at 50% 100%, var(--gold) 0 6deg, transparent 6deg 15deg);
  -webkit-mask: radial-gradient(circle at 50% 100%, transparent 22px, #000 23px, #000 78px, transparent 79px);
          mask: radial-gradient(circle at 50% 100%, transparent 22px, #000 23px, #000 78px, transparent 79px);
  opacity: .9;
}
.kicker { font-family: var(--deco); letter-spacing: .4em; text-transform: uppercase; color: var(--gold); font-size: 14px; font-weight: 700; }
h1.logo { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 8vw, 84px); line-height: 1; margin: 14px 0 6px;
  color: var(--gold-2); text-shadow: 0 2px 0 #000; }
.tagline { font-style: italic; color: var(--text-dim); font-size: 17px; max-width: 560px; margin: 12px auto 30px; }
.title-buttons { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

/* ---------- case select ---------- */
#select { padding: 40px 16px 60px; }
.page-head { text-align: center; margin-bottom: 30px; }
.page-head h2 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 5vw, 46px); color: var(--gold-2); margin: 8px 0; }
.day-switch { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
.day-switch[hidden] { display: none; }
.case-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 22px; max-width: 1100px; margin: 0 auto; }
.case-card {
  background: var(--paper); color: var(--ink); text-align: left; border: none; padding: 0;
  box-shadow: 0 10px 30px rgba(0,0,0,.45); position: relative; transition: transform .15s;
  display: flex; flex-direction: column;
}
.case-card:hover, .case-card:focus-visible { transform: translateY(-4px) rotate(-.4deg); outline: none; }
.case-card .tab { background: var(--paper-2); padding: 10px 16px; font-family: var(--type); font-size: 14px; display: flex; justify-content: space-between; border-bottom: 1px dashed #a8956a; }
.case-card .body { padding: 16px 18px 20px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.case-card h3 { font-family: var(--display); font-weight: 400; font-size: 25px; margin: 0; line-height: 1.1; }
.case-card .meta { font-family: var(--type); font-size: 13px; color: #5c5240; }
.case-card .blurb { font-size: 14.5px; line-height: 1.45; margin-top: 6px; color: #3a3226; }
.case-card.done .tags { padding-right: 120px; }
.case-card .tags { margin-top: auto; padding-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-family: var(--type); font-size: 12px; border: 1px solid #6d5d3d; padding: 2px 6px; color: #4d4230; }
.stamp {
  position: absolute; bottom: 14px; right: 12px; transform: rotate(-8deg);
  font-family: var(--type); color: var(--blood); border: 3px double var(--blood); padding: 4px 10px;
  font-size: 18px; letter-spacing: .1em; opacity: .85; background: rgba(241,230,207,.6);
}
.back-row { text-align: center; margin-top: 34px; }

/* ---------- game ---------- */
#game { padding: 14px 16px 40px; }
.topbar { display: flex; align-items: center; gap: 12px; max-width: 1800px; margin: 0 auto 14px; flex-wrap: wrap; }
.topbar .case-name { font-family: var(--display); font-size: clamp(22px, 3vw, 30px); color: var(--gold-2); flex: 1; min-width: 200px; }
.topbar .case-name small { display: block; font-family: var(--type); font-size: 14px; color: var(--text-dim); letter-spacing: .05em; }
.top-links { display: flex; gap: 2px; flex-wrap: wrap; }
.link { background: none; border: none; font-family: var(--type); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim); padding: 12px 8px; }
.link:hover, .link:focus-visible { color: var(--gold-2); outline: none; text-decoration: underline; text-underline-offset: 4px; }
.timer { font-family: var(--type); font-weight: 700; color: var(--gold-2); font-size: 20px; min-width: 64px; text-align: right; }
.layout { display: grid; grid-template-columns: minmax(0, auto) minmax(300px, 400px); gap: 24px; max-width: 1800px; margin: 0 auto; align-items: start; justify-content: center; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.board-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.board-frame { padding: 14px; background: #14161f; border: 1px solid var(--gold-dim); box-shadow: 0 0 0 6px var(--ink), 0 0 0 7px rgba(201,163,78,.45), 0 18px 40px rgba(0,0,0,.6); position: relative; }
.board { display: grid; position: relative; background: var(--wall); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
/* layers in a square, bottom to top: floor tint and staff hatch, object, window, brass corner,
   claimed wash, cross-out and draft marks, lens and hint overlay, token, room label */
.cell { position: relative; border: 1px solid rgba(42,36,24,.16); cursor: pointer; }
.cell.wt { border-top: 3px solid var(--wall); }
.cell.wb { border-bottom: 3px solid var(--wall); }
.cell.wl { border-left: 3px solid var(--wall); }
.cell.wr { border-right: 3px solid var(--wall); }
.cell.staff::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, rgba(120,40,30,.16) 0 4px, transparent 4px 10px); pointer-events: none; }
.cell.blocked { cursor: not-allowed; }
.cell .obj { position: absolute; left: 8%; top: 8%; width: 84%; height: 84%; z-index: 1; pointer-events: none; }
.cell .win { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
.cell.win-right .win { transform: rotate(90deg); }
.cell.win-bottom .win { transform: rotate(180deg); }
.cell.win-left .win { transform: rotate(270deg); }
.cell .corner { position: absolute; top: 0; right: 0; width: 24%; height: 24%; z-index: 2; pointer-events: none; }
.cell.claimed::after { content: ""; position: absolute; inset: 0; background: rgba(26,29,42,.2); z-index: 2; pointer-events: none; }
.cell .mark { position: absolute; inset: 0; display: grid; place-items: center; z-index: 3; color: #a35f43; font-family: var(--type); font-weight: 700; font-size: calc(var(--cell) * .62); line-height: 1; pointer-events: none; }
.drafts { position: absolute; left: 4%; right: 4%; bottom: 3%; display: flex; flex-wrap: wrap; gap: 0 calc(var(--cell) * .04); z-index: 3; pointer-events: none; }
.draft { font-family: var(--type); font-style: italic; font-weight: 700; font-size: max(10px, calc(var(--cell) * .19)); line-height: 1.05; color: #4a3f2c; background: rgba(244,236,216,.72); padding: 0 .16em; }
.draft.dim { opacity: .5; }
.draft.focus { color: #231f1c; background: var(--gold-2); }
.cell .fx { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.cell.lens .fx { box-shadow: inset 0 0 0 2px rgba(201,163,78,.95); }
.cell.lens-off .fx { background: rgba(26,29,42,.5); }
.cell.away .fx { background: rgba(26,29,42,.5); }
.cell.hint-flash .fx { animation: flash 1s ease-in-out 3; }
@keyframes flash { 50% { box-shadow: inset 0 0 0 4px var(--blood); } }
.cell .room-label { position: absolute; top: 1px; left: 2px; z-index: 6; padding: 0 2px; background: rgba(244,236,216,.78); overflow: hidden; text-overflow: ellipsis; font-family: var(--type); font-weight: 700; font-size: clamp(8px, calc(var(--cell) * .15), 12px); letter-spacing: .06em; text-transform: uppercase; color: #4a3f2c; white-space: nowrap; pointer-events: none; line-height: 1.25; }
.cell .room-label.vertical { writing-mode: vertical-rl; top: 2px; left: 1px; padding: 2px 0; }

/* centred with inset, not a transform: the drop animation below animates transform */
.token { position: absolute; inset: 24%; border-radius: 50%; display: grid; place-items: center; font-family: var(--serif); font-weight: 700;
  font-size: calc(var(--cell) * .26); line-height: 1; color: #f4ecd8; border: max(1.5px, calc(var(--cell) * .028)) solid #f4ecd8;
  box-shadow: 0 calc(var(--cell) * .02) calc(var(--cell) * .05) rgba(0,0,0,.45); z-index: 4; pointer-events: none; animation: drop .18s ease-out; }
.token.victim::after { content: "\2020"; position: absolute; top: -22%; right: -22%; width: 46%; height: 46%; border-radius: 50%; background: var(--blood); border: 1px solid #f4ecd8;
  display: grid; place-items: center; font-size: calc(var(--cell) * .14); }
.token.selected { outline: max(2px, calc(var(--cell) * .03)) solid var(--gold); outline-offset: 2px; }
.token.flagged { outline: max(3px, calc(var(--cell) * .05)) solid var(--blood); outline-offset: 2px; }
@keyframes drop { from { transform: scale(1.4); opacity: 0; } }

.tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.status { font-family: var(--serif); font-size: 14.5px; color: var(--text-dim); text-align: center; min-height: 1.3em; max-width: 560px; }
.status.warn { color: #e48a7f; }
.status.good { color: #9fcf9f; }

/* dossier */
.dossier { background: var(--ink-2); border: 1px solid var(--gold-dim); padding: 16px; }
.dossier h4 { font-family: var(--deco); font-weight: 700; letter-spacing: .25em; text-transform: uppercase; color: var(--gold); font-size: 13px; margin: 0; }
.dossier-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 10px; font-family: var(--type); font-size: 13px; color: var(--text-dim); }
.twist { border: 1px dashed var(--blood); background: rgba(158,43,37,.12); padding: 10px 12px; margin-bottom: 14px; font-size: 14.5px; }
.twist b { font-family: var(--deco); letter-spacing: .15em; text-transform: uppercase; color: #e48a7f; font-size: 13px; display: block; }
.people { display: flex; flex-direction: column; gap: 8px; }
.person { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; text-align: left; background: var(--ink-3); border: 1px solid transparent; padding: 8px 10px; color: var(--text); width: 100%; }
.person:hover { border-color: var(--gold-dim); }
.person.selected { border-color: var(--gold-2); background: #343a49; box-shadow: 0 0 0 1px var(--gold-2); }
.person.victim-card { background: #261a1a; }
.person .chip { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--serif); font-weight: 700; font-size: 16px; color: #f4ecd8; border: 2px solid #f4ecd8; }
.person .who { font-weight: 700; font-size: 15.5px; line-height: 1.2; }
.person .who small { font-weight: 400; font-style: italic; color: var(--text-dim); font-size: 12.5px; display: block; }
.person .clue { font-size: 14px; color: var(--text); margin-top: 4px; line-height: 1.4; }
.person .state { font-family: var(--type); font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); min-width: 26px; text-align: right; }
.person .state.placing { color: var(--gold-2); }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(143,118,66,.4); font-family: var(--type); font-size: 13px; color: var(--text); }
.legend h5 { margin: 0 0 6px; font-family: var(--type); font-weight: 700; font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--text-dim); }
.legend .items { display: flex; flex-wrap: wrap; gap: 6px 12px; }
.legend .items span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend-art { width: 26px; height: 26px; background: #ecdcb8; flex: none; }
.legend .note { grid-column: 1 / -1; color: var(--text-dim); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
.legend .note svg { width: 12px; height: 12px; flex: none; }

/* modal */
.modal-bg { position: fixed; inset: 0; background: rgba(8,9,12,.82); display: none; place-items: center; z-index: 50; padding: 16px; overflow-y: auto; }
.modal-bg.open { display: grid; }
.modal { background: var(--paper); color: var(--ink); max-width: 640px; width: 100%; padding: 30px 30px 26px; position: relative; box-shadow: 0 30px 60px rgba(0,0,0,.6); }
.modal::before { content: ""; position: absolute; inset: 8px; border: 1px solid #a8956a; pointer-events: none; }
.modal h2 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 6vw, 38px); margin: 4px 0 8px; line-height: 1.05; }
.modal .kicker { color: #7d6531; }
.modal p { font-size: 15.5px; line-height: 1.55; margin: 10px 0; }
.modal .typed { font-family: var(--type); font-size: 15px; background: rgba(0,0,0,.04); border-left: 3px solid #7d6531; padding: 10px 12px; }
.modal .btn { color: var(--ink); border-color: var(--ink); }
.modal .btn:hover { background: var(--ink); color: var(--paper); }
.modal .btn.primary { background: var(--ink); color: var(--paper); }
.modal .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; margin-top: 18px; }
.modal ol, .modal ul { font-size: 15px; line-height: 1.5; padding-left: 22px; }
.modal li { margin: 4px 0; }
.accuse-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; margin-top: 12px; }
.accuse-list button { display: flex; align-items: center; gap: 8px; background: #fff8e8; border: 1px solid #a8956a; padding: 8px; min-height: 46px; text-align: left; font-size: 15px; color: var(--ink); }
.accuse-list button:hover { background: var(--ink); color: var(--paper); }
.accuse-list .chip, .objection .chip { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--serif); font-weight: 700; font-size: 13px; color: #f4ecd8; flex: none; }
.stamp-closed { position: absolute; top: -12px; right: 18px; transform: rotate(-5deg); font-family: var(--type); font-weight: 700; color: var(--blood); border: 2px solid var(--blood); outline: 1px solid var(--blood); outline-offset: 2px; padding: 4px 12px; font-size: 14px; letter-spacing: .2em; text-transform: uppercase; background: var(--paper); }
.modal h2.verdict-head { font-size: clamp(32px, 7vw, 46px); margin: 10px 0 12px; }
.stats { display: flex; gap: 32px; margin: 16px 0 4px; padding: 14px 0; border-top: 1px dashed #a8956a; border-bottom: 1px dashed #a8956a; }
.stats b { display: block; font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.1; }
.stats span { font-family: var(--type); font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: #5c5240; }
.modal .fine { font-style: italic; font-size: 13.5px; color: #5c5240; }
.objection { display: flex; gap: 12px; align-items: flex-start; background: #fff8e8; border: 1px solid #a8956a; padding: 12px 14px; margin: 12px 0; }
.objection p { margin: 0 0 4px; }
.objection .quote { font-weight: 700; }
.rules { counter-reset: rule; list-style: none; padding-left: 0 !important; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.rules li { counter-increment: rule; background: #fff8e8; border: 1px solid #a8956a; padding: 10px 12px; margin: 0; }
.rules li::before { content: "0" counter(rule); display: block; font-family: var(--type); font-weight: 700; font-size: 12px; letter-spacing: .2em; color: #7d6531; }
.rules li b { display: block; font-family: var(--display); font-weight: 400; font-size: 18px; line-height: 1.15; margin: 2px 0 4px; }
.rules .art-row { display: flex; align-items: center; gap: 4px; margin-top: 6px; flex-wrap: wrap; font-family: var(--type); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: #5c5240; }
.rules .art-row .legend-art { width: 30px; height: 30px; }
.modal.wide { max-width: 860px; }
.toolkit { font-family: var(--type); font-size: 13.5px; line-height: 1.6; }
/* ---------- phone ---------- */
.tray, .statement, .sheet-head, .sheet-tools, .head-count, #tool-casebook { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
/* the small viewport: it does not change as the browser's bars slide in and out, so the board is not rebuilt mid-scroll */
#vh-probe { position: fixed; top: 0; left: 0; width: 0; height: 100vh; height: calc(100svh - env(safe-area-inset-bottom, 0px)); visibility: hidden; pointer-events: none; }
@media (max-width: 600px) {
  body { font-size: 17px; }
  body.sheet-open { overflow: hidden; }
  /* the heights and margins in this block are mirrored by PHONE_CHROME, PHONE_FRAME and PHONE_MARGIN in the script */
  #game { min-height: 100svh; padding: 0 8px calc(60px + env(safe-area-inset-bottom, 0px)); }
  .topbar { flex-wrap: nowrap; height: 56px; margin: 0; gap: 8px; }
  #btn-back-cases { flex: none; width: 44px; height: 44px; padding: 0; font-size: 0; }
  #btn-back-cases::before { content: "\2190"; font-size: 18px; }
  .topbar .case-name { min-width: 0; font-size: 20px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .case-name small { font-size: 12px; letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; }
  .head-count { display: inline; }
  .top-links { display: none; }
  .timer { flex: none; min-width: 0; font-size: 18px; }
  .layout { display: block; }
  .board-wrap { gap: 10px; }
  .board-frame { padding: 4px; box-shadow: 0 0 0 3px var(--ink), 0 0 0 4px var(--gold-dim); }
  .status { display: none; }

  .tray { display: flex; justify-content: center; align-items: center; gap: 6px; width: 100%; height: 56px; }
  .tray-btn { flex: 0 1 52px; min-width: 44px; height: 52px; padding: 0; background: none; border: 0; display: grid; place-items: center; position: relative; }
  .tray-btn .chip { position: relative; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-family: var(--serif); font-weight: 700; font-size: 16px; line-height: 1; color: #f4ecd8; border: 2px solid #f4ecd8; }
  .tray-btn.victim .chip::after { content: "\2020"; position: absolute; top: -5px; right: -5px; width: 16px; height: 16px; border-radius: 50%; background: var(--blood); border: 1px solid #f4ecd8; display: grid; place-items: center; font-size: 10px; }
  .tray-btn.placed .chip { opacity: .5; }
  .tray-btn.placed::after { content: "\2713"; position: absolute; right: 0; bottom: 1px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); border: 1px solid var(--gold); color: var(--gold-2); font: 700 11px/16px var(--type); text-align: center; }
  .tray-btn.selected .chip { opacity: 1; box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--gold); }
  .tray-btn:focus-visible { outline: 2px solid var(--gold-2); }

  .statement { display: flex; align-items: center; width: 100%; height: 60px; padding: 0 12px; overflow: hidden; background: var(--ink-2); border-left: 3px solid var(--gold); font-size: 15px; line-height: 1.3; color: var(--text); }
  .statement.warn { color: #e48a7f; border-left-color: #e48a7f; }
  .statement.good { color: #9fcf9f; border-left-color: #9fcf9f; }

  .tools { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; flex-wrap: nowrap; gap: 6px; padding: 7px 8px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--ink); border-top: 1px solid var(--gold-dim); }
  .tools .btn { flex: 0 0 44px; height: 44px; padding: 0; font-size: 0; letter-spacing: 0; display: grid; place-items: center; }
  .tools .btn::before { font-family: var(--serif); font-size: 20px; line-height: 1; }
  #tool-draft::before { content: "\270E"; }
  #tool-mark::before { content: "\00D7"; font-size: 26px; }
  #tool-undo::before { content: "\21BA"; }

  #tool-casebook, #tool-submit { flex: 1 1 0; min-width: 0; }

  #tool-submit { font-size: 13px; letter-spacing: .06em; }

  /* the testimony panel becomes the Casebook: a sheet over the whole screen */
  .dossier { display: none; position: fixed; inset: 0; z-index: 40; overflow-y: auto; overscroll-behavior: contain; background: var(--paper); color: var(--wall); border: 0; padding: 0 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
  .dossier.open { display: block; }
  .dossier-head { display: none; }
  .sheet-head { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 1; background: var(--paper); padding: calc(10px + env(safe-area-inset-top, 0px)) 0 8px; border-bottom: 1px solid rgba(42,36,24,.3); }
  .sheet-head h3 { flex: 1; margin: 0; font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1; }
  .sheet-head span { font-family: var(--type); font-size: 13px; color: #5c5240; }
  #casebook-close { flex: none; width: 44px; height: 44px; padding: 0; background: none; border: 1px solid var(--wall); color: var(--wall); font-size: 26px; line-height: 1; }
  .dossier .twist { margin: 12px 0 0; }
  .dossier .twist b { color: var(--blood); }
  .people { gap: 0; }
  .person, .person.victim-card { background: none; color: var(--wall); border: 0; border-bottom: 1px solid rgba(42,36,24,.2); padding: 12px 4px; }
  .person.selected { background: var(--paper-2); box-shadow: none; }
  .person .chip { box-shadow: 0 0 0 1px rgba(42,36,24,.4); }
  .person .clue { color: var(--wall); font-size: 15px; }
  .person .who small, .person .state, .legend h5, .legend .note { color: #5c5240; }
  .person .state.placing { color: #6e521c; }
  .legend { color: var(--wall); border-top-color: rgba(42,36,24,.3); }
  .sheet-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(42,36,24,.3); }
  #sheet-tools button { flex: 1 1 40%; min-height: 44px; padding: 0 10px; background: none; border: 1px solid var(--wall); color: var(--wall); font-family: var(--type); font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; text-decoration: none; }
  #sheet-tools button[aria-pressed="true"] { background: var(--wall); color: var(--paper); }
  #sheet-tools button:focus-visible, #casebook-close:focus-visible { outline: 2px solid var(--wall); outline-offset: 2px; }
  #tool-casebook:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 2px; }
}

    <button class="btn" id="btn-how">How to Investigate</button>
  </div>

        return this.nbrs(r,k).some(([a,b]) => this.obj(a,b) === cl.obj && this.room(a,b) === this.room(r,k));
      case "corner": return this.isCorner(r,k);
      case "rowWith": for (let j = 0; j < this.n; j++) if (this.obj(r,j) === cl.obj) return true; return false;
      case "colWith": for (let j = 0; j < this.n; j++) if (this.obj(j,k) === cl.obj) return true; return false;
    }
    throw new Error(cl.type);
  }
  binaryOk(cl, a, b) {
    switch (cl.type) {
      case "sameRoom": return this.room(a[0],a[1]) === this.room(b[0],b[1]);
      case "north": return a[0] < b[0];
      case "west": return a[1] < b[1];
      case "diagonal": return Math.abs(a[0]-b[0]) === 1 && Math.abs(a[1]-b[1]) === 1;
    }
    throw new Error(cl.type);
  }
}

// Human-style deduction; returns the order in which people become certain (for hints).
function deduce(board, people, clues) {
  const n = board.n, k = people.length, key = (r,c) => r*n + c;
  let cands = people.map((p, i) => {
    const s = new Set();
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
      if (board.allowed(p, r, c) && (!UNARY.has(clues[i].type) || board.unaryOk(clues[i], r, c))
          && !clues.some((cl, j) => j !== i && ONLY[cl.type] && board.unaryOk(cl, r, c))) s.add(key(r,c));
    return s;
  });
  const rc = v => [Math.floor(v / n), v % n];
  const order = [];
  const noteSolved = () => cands.forEach((s, i) => { if (s.size === 1 && !order.includes(i)) order.push(i); });
  const setIf = (i, s) => { if (s.size !== cands[i].size) { cands[i] = s; return true; } return false; };
  noteSolved();
  let changed = true, guard = 0;
  while (changed && guard++ < 500) {
    changed = false;
    if (cands.some(s => s.size === 0)) return { cands: null, order };
    for (let i = 0; i < k; i++) if (cands[i].size === 1) {
      const [r, c] = rc([...cands[i]][0]);
      for (let j = 0; j < k; j++) if (j !== i)
        changed = setIf(j, new Set([...cands[j]].filter(v => { const [a,b] = rc(v); return a !== r && b !== c; }))) || changed;
    }
    if (changed) { noteSolved(); continue; }
    for (const ax of [0, 1]) for (let line = 0; line < n; line++) {
      const who = [];
      for (let i = 0; i < k; i++) if ([...cands[i]].some(v => rc(v)[ax] === line)) who.push(i);
      if (who.length === 0) return { cands: null, order };
      if (who.length === 1) changed = setIf(who[0], new Set([...cands[who[0]]].filter(v => rc(v)[ax] === line))) || changed;
    }
    if (changed) { noteSolved(); continue; }
    outer: for (const ax of [0, 1]) {
      const groups = [];
      for (let i = 0; i < k; i++) groups.push([i]);
      for (let i = 0; i < k; i++) for (let j = i+1; j < k; j++) groups.push([i, j]);
      for (const g of groups) {
        const lines = new Set(); g.forEach(i => cands[i].forEach(v => lines.add(rc(v)[ax])));
        if (lines.size !== g.length) continue;
        for (let j = 0; j < k; j++) if (!g.includes(j))
          changed = setIf(j, new Set([...cands[j]].filter(v => !lines.has(rc(v)[ax])))) || changed;
      }
      if (changed) break outer;
    }
    if (changed) { noteSolved(); continue; }
    for (let i = 0; i < k; i++) {
      const cl = clues[i];
      if (!BINARY.has(cl.type)) continue;
      const j = cl.other;
      const ok = (a, b) => { const A = rc(a), B = rc(b); return A[0] !== B[0] && A[1] !== B[1] && board.binaryOk(cl, A, B); };
      const ni = new Set([...cands[i]].filter(a => [...cands[j]].some(b => ok(a, b))));
      const nj = new Set([...cands[j]].filter(b => [...ni].some(a => ok(a, b))));
      if (setIf(i, ni)) changed = true;
      if (setIf(j, nj)) changed = true;
    }
    noteSolved();
  }
  return { cands: cands.map(s => [...s].map(rc)), order };
}

// Dev check: open the console and run verifyCases()
function verifyCases() {
  return TIERS.flatMap(t => DATA.puzzles[t.id]).map(c => {
    const b = new Board(c), people = [c.victim, ...c.suspects];
    const res = deduce(b, people, c.clues);
    const ok = res.cands && res.cands.every((s, i) => s.length === 1 && s[0][0] === c.solution[i][0] && s[0][1] === c.solution[i][1]);
    return `${c.id}: ${ok ? "OK" : "FAIL"}`;
  });
}

// ---------------------------------------------------------------- daily schedule
const DAY_MS = 86400000;
// Development only: ?day=7 pins the day number so a full rotation can be tested without waiting.
// build.py --public switches this off, so a shared link cannot be used to browse other days.
const DEV_BUILD = false;
const TEST_DAY = DEV_BUILD ? (() => { const v = parseInt(new URLSearchParams(location.search).get("day"), 10); return v >= 1 ? v : null; })() : null;

function currentDay() {
  if (TEST_DAY) return TEST_DAY;
  const [y, m, d] = DATA.epoch.split("-").map(Number);
  const now = new Date();
  // compare calendar dates rather than elapsed time, so the day changes at the player's own midnight
  const days = Math.round((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - Date.UTC(y, m - 1, d)) / DAY_MS);
  return Math.max(1, days + 1);
}
function puzzleFor(tierId, day) { const pool = DATA.puzzles[tierId]; return pool[(day - 1) % pool.length]; }

// ---------------------------------------------------------------- storage (best-effort)
// Test days keep their own results so trying out other days never touches real progress.
const STORE_KEY = TEST_DAY ? "orderly-murder-daily-test" : "orderly-murder-daily";
const store = {
  get() {
    let v;
    try { v = JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch { v = {}; }
    if (!v || typeof v !== "object") v = {};
    if (!v.days || typeof v.days !== "object") v.days = {};
    return v;
  },
  // the game stays fully playable without storage; only the solved stamps are lost
  set(v) { try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); } catch {} },
  // a result belongs to a case, not only to a day: when the pool changes under a player,
  // what they did on another case must not show up on the one that took its place
  entry(day, tierId) {
    const d = this.get().days[day], id = d && d["case:" + tierId];
    return d && (!id || id === puzzleFor(tierId, day)?.id) ? d : null;
  },
  put(day, tierId, key, value) {
    const v = this.get(), d = (v.days[day] = v.days[day] || {}), id = puzzleFor(tierId, day)?.id;
    if (d["case:" + tierId] && d["case:" + tierId] !== id) { delete d[tierId]; delete d["hints:" + tierId]; }
    d["case:" + tierId] = id;
    d[key] = value;
    this.set(v);
  },
  result(day, tierId) { return this.entry(day, tierId)?.[tierId] || null; },
  hintsUsed(day, tierId) { return this.entry(day, tierId)?.["hints:" + tierId] || 0; },
  setHintsUsed(day, tierId, n) { this.put(day, tierId, "hints:" + tierId, n); },
  record(day, tierId, result) { this.put(day, tierId, tierId, result); },
  // only today and yesterday can be played, so nothing else is kept
  prune(today) {
    const v = this.get();
    const stale = Object.keys(v.days).filter(k => +k !== today && +k !== today - 1);
    if (!stale.length) return;
    stale.forEach(k => delete v.days[k]);
    this.set(v);
  },
};

const $ = id => document.getElementById(id);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const initials = name => name.replace(/^(Lord|Lady|Mr\.|Mrs\.|Miss|Dr\.|Colonel|Countess|Father|Sir|Signora|Captain|Detective Sgt\.)\s+/, "")
  .replace(/'[^']*'\s*/g, "").split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const fmtTime = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
// the one test for the phone layout; the stylesheet's media query uses the same width
const PHONE = window.matchMedia("(max-width: 600px)");
const isPhone = () => PHONE.matches;
const roomRef = name => name.startsWith("Compartment") ? name : "the " + name;
const staffWord = c => /crew/i.test(c.twist?.title || "") ? "Crew" : "Staff";

function showHowTo(onClose) {

$("btn-how").onclick = () => showHowTo();
$("btn-open-cases").onclick = () => { viewOffset = 0; renderDay(); show("select"); };
$("btn-back-title").onclick = () => show("title");
$("btn-back-cases").onclick = () => { stopTimer(); backToDay(); };
$("btn-day-today").onclick = () => { viewOffset = 0; renderDay(); };
$("btn-day-yesterday").onclick = () => { viewOffset = 1; renderDay(); };

let viewOffset = 0;  // 0 = today, 1 = yesterday

// The day is read every time this screen is drawn, so a tab left open overnight rolls over here.
function renderDay() {
  const today = currentDay();
  store.prune(today);
  if (today === 1) viewOffset = 0;
  const day = today - viewOffset;
  $("day-kicker").textContent = `The Inspector's Desk · Day ${day}${TEST_DAY ? " · test day" : ""}`;
  $("day-heading").textContent = viewOffset ? "Yesterday's Cases" : "Today's Cases";
  $("day-switch").hidden = today === 1;
  $("btn-day-today").setAttribute("aria-pressed", String(viewOffset === 0));
  $("btn-day-yesterday").setAttribute("aria-pressed", String(viewOffset === 1));
  const grid = $("case-grid"); grid.innerHTML = "";
  TIERS.forEach(t => {
    const c = puzzleFor(t.id, day);
    const done = store.result(day, t.id);
    const card = el("button", "case-card" + (done ? " done" : ""));
    const tags = [`${c.suspects.length} suspects`];
    if (c.twist) tags.push(`Local rule: ${c.twist.title}`);
    const blurb = c.intro.split(". ").slice(0, 2).join(". ").replace(/\.$/, "") + ".";
    card.innerHTML = `
      <div class="tab"><span>${esc(t.label)}</span><span>${c.n}×${c.n}</span></div>
      <div class="body">
        <h3>${esc(c.title)}</h3>
        <div class="meta">${esc(c.date)}</div>
        <div class="blurb">${esc(blurb)}</div>
        <div class="tags">${tags.map(tag => `<span class="tag">${esc(tag)}</span>`).join("")}</div>
      </div>
      ${done ? `<div class="stamp">${done.gaveUp ? "GIVEN UP" : "SOLVED · " + fmtTime(done.time)}</div>` : ""}`;
    card.onclick = () => startCase(c, day);
    grid.appendChild(card);
  });
}

// Returns to the day the current puzzle belongs to; a puzzle left open for days falls back to yesterday.
function backToDay() {
  viewOffset = Math.min(1, Math.max(0, currentDay() - state.day));
  renderDay();
  show("select");
}

// ---------------------------------------------------------------- game state
let state = null;
let timerHandle = null;

function startTimer() {
  stopTimer();
  timerHandle = setInterval(() => {
    if (!state || state.solved || document.hidden) return;
    state.elapsed++; $("timer").textContent = fmtTime(state.elapsed);
  }, 1000);
}
function stopTimer() { if (timerHandle) clearInterval(timerHandle); timerHandle = null; }

function startCase(c, day) {
  const people = [{ ...c.victim, victim: true }, ...c.suspects];
  state = {
    day, c, board: new Board(c), people,
    pos: people.map(() => null),            // [r,c] per person
    marks: new Set(),                        // "r,c"
    drafts: new Map(),                       // "r,c" -> Set(person idx)
    draftMode: false,
    history: [],
    selected: 1, markMode: false, lens: false,
    // hints already spent on this case today still count, so leaving and reopening does not refill them
    hints: store.hintsUsed(day, c.tier), lensUses: 0, wrongAccusations: 0, falseStarts: 0, elapsed: 0, solved: false, gaveUp: false, locked: false,
  };
  $("case-name").innerHTML = `${esc(c.title)}<small>${esc(c.subtitle)} · Day ${day}<span class="head-count" id="head-count"></span></small>`;
  $("timer").textContent = "0:00";
  $("tool-mark").setAttribute("aria-pressed", "false");
  $("tool-draft").setAttribute("aria-pressed", "false");
  $("tool-lens").setAttribute("aria-pressed", "false");
  $("twist-box").innerHTML = c.twist ? `<div class="twist"><b>Local rule: ${esc(c.twist.title)}</b>${esc(c.twist.text)}</div>` : "";
  buildBoard(); buildPeople(); buildTray(); buildLegend(); updateHintButton();
  show("game");
  render();
  // the Starter is where new players arrive, so it opens with the briefing; bigger cases begin at once
  if (c.n < 5) showBriefing(true); else startTimer();
}

// ---------------------------------------------------------------- board
// header 56 + tray 56 + statement 60 + bar 60 + two 10px gaps, as the phone stylesheet sets them, + 10px of air above the bar.
// They are constants because the board is built before the game screen is shown and can be measured.
const PHONE_CHROME = 262;
// around the board: frame padding 4 + frame border 1 on each side, and across the width a page margin of 8 as well
const PHONE_FRAME = 10, PHONE_MARGIN = 16;
function cellSize(n) {
  const vw = document.documentElement.clientWidth || window.innerWidth;
  if (isPhone()) {
    const byWidth = Math.floor((vw - PHONE_MARGIN - PHONE_FRAME) / n);
    const tall = $("vh-probe").offsetHeight || window.innerHeight;
    const byHeight = Math.floor((tall - PHONE_CHROME - PHONE_FRAME) / n);
    // shrink to keep the game on one screen, but not below a comfortable tap; past that the page scrolls
    return Math.min(byWidth, Math.max(byHeight, 44));
  }
  const vh = window.innerHeight;
  const stacked = vw <= 900;
  const availW = stacked ? vw - 110 : vw - 400 - 24 - 130;
  const availH = stacked ? Infinity : vh - 200;
  return Math.max(28, Math.min(130, Math.floor(Math.min(availW, availH) / n)));
}

function buildBoard() {
  const { board: b, c } = state;
  const n = b.n;
  const cell = state.cellSize = cellSize(n);
  document.documentElement.style.setProperty("--cell", cell + "px");
  const frame = $("board-frame");
  frame.innerHTML = "";

  const grid = el("div", "board");
  grid.id = "board";
  grid.style.gridTemplateColumns = `repeat(${n}, ${cell}px)`;
  grid.style.gridTemplateRows = `repeat(${n}, ${cell}px)`;
  const roomCodes = [...new Set(c.rooms.join(""))];
  const labelled = new Set();
  state.cells = [];
  for (let r = 0; r < n; r++) {
    state.cells.push([]);
    for (let k = 0; k < n; k++) {
      const d = el("div", "cell");
      const rm = b.room(r, k), o = b.obj(r, k);
      // the grid carries no letters or numbers, so the position is spelled out for hover and screen readers
      const where = `row ${r + 1}, column ${k + 1}`;
      d.style.background = ROOM_TINTS[roomCodes.indexOf(rm) % ROOM_TINTS.length];
      if (b.edge(r, k, -1, 0)) d.classList.add("wt");
      if (b.edge(r, k, 1, 0)) d.classList.add("wb");
      if (b.edge(r, k, 0, -1)) d.classList.add("wl");
      if (b.edge(r, k, 0, 1)) d.classList.add("wr");
      if (b.staffRooms.has(rm)) d.classList.add("staff");
      if (!labelled.has(rm)) {
        labelled.add(rm);
        let wide = 0, tall = 0;
        while (k + wide < n && b.room(r, k + wide) === rm) wide++;
        while (r + tall < n && b.room(r + tall, k) === rm) tall++;
        const lab = el("span", "room-label", esc(c.roomNames[rm]) + (b.staffRooms.has(rm) ? " · " + staffWord(c) : ""));
        if (wide === 1 && tall >= 3) { lab.classList.add("vertical"); lab.style.maxHeight = (tall * cell - 4) + "px"; }
        else lab.style.maxWidth = (wide * cell - 5) + "px";
        d.appendChild(lab);
      }
      if (o !== ".") {
        const L = c.legend[o];
        if (L.blocking) d.classList.add("blocked");
        if (L.wall) {
          // on a corner square the top or bottom wall wins
          d.classList.add(r === 0 ? "win-top" : r === n - 1 ? "win-bottom" : k === 0 ? "win-left" : "win-right");
          d.insertAdjacentHTML("beforeend", artSvg("window", "win"));
        } else {
          d.insertAdjacentHTML("beforeend", artSvg(ART[L.name], "obj"));
        }
        if (!L.blocking) d.insertAdjacentHTML("beforeend", CORNER_SVG);
        d.title = L.wall ? `${c.roomNames[rm]} · in front of a window · ${where}`
          : `${c.roomNames[rm]} · ${L.name}${L.blocking ? " (solid)" : " (someone can be here)"} · ${where}`;
      } else {
        d.title = `${c.roomNames[rm]} · ${where}`;
      }
      d.appendChild(el("div", "fx"));
      d.dataset.r = r; d.dataset.c = k;
      d.addEventListener("click", () => onCellClick(r, k, false));
      d.addEventListener("contextmenu", e => { e.preventDefault(); onCellClick(r, k, true); });
      let pressTimer = null;
      d.addEventListener("touchstart", () => { pressTimer = setTimeout(() => { pressTimer = "fired"; onCellClick(r, k, true); }, 450); }, { passive: true });
      d.addEventListener("touchend", e => { if (pressTimer === "fired") e.preventDefault(); else clearTimeout(pressTimer); pressTimer = null; });
      d.addEventListener("touchmove", () => { if (pressTimer && pressTimer !== "fired") clearTimeout(pressTimer); pressTimer = null; }, { passive: true });
      grid.appendChild(d);
      state.cells[r].push(d);
    }
  }
  frame.appendChild(grid);
}

function buildPeople() {
  const list = $("people"); list.innerHTML = "";
  const staffTag = " · " + staffWord(state.c).toLowerCase();
  state.cards = state.people.map((p, i) => {
    const b = el("button", "person" + (p.victim ? " victim-card" : ""));
    p.color = p.victim ? VICTIM_COLOR : TOKEN_COLORS[(i - 1) % TOKEN_COLORS.length];

function buildTray() {

function buildLegend() {
  const names = [...new Set(Object.values(state.c.legend).map(L => L.name))].filter(name =>
    state.c.objects.some(row => [...row].some(o => o !== "." && state.c.legend[o].name === name)));
  const item = name => `<span>${artSvg(ART[name], "legend-art")} ${esc(name)}</span>`;
  const blocks = name => Object.values(state.c.legend).find(L => L.name === name).blocking;
  $("legend").innerHTML = `
    <div><h5>Room to stand</h5><div class="items">${names.filter(n => !blocks(n)).map(item).join("")}</div></div>
    <div><h5>Solid, nobody here</h5><div class="items">${names.filter(blocks).map(item).join("")}</div></div>
    <div class="note"><svg viewBox="0 0 10 10" aria-hidden="true"><use href="#om-corner"/></svg> A brass corner means someone can be on that square. A window is in the wall; you stand in front of it.</div>`;
}

// ---------------------------------------------------------------- interaction
// a new move clears the last message and any tokens the Inspector ringed
function clearNotices() {
  state.ringed = null; state.flash = null; clearTimeout(statusTimer);
  // emptied so that the same message twice running is announced twice
  $("announce").textContent = "";
}

function select(i) {
  if (state.solved) return;
  clearNotices();
  state.selected = state.selected === i ? null : i;
  render();
}

function copyDrafts(m) { return new Map([...m].map(([key, v]) => [key, new Set(v)])); }
function snapshot() { state.history.push({ pos: state.pos.map(p => p && [...p]), marks: new Set(state.marks), drafts: copyDrafts(state.drafts) }); if (state.history.length > 300) state.history.shift(); }
function toggleDraft(key, i) {
  const s = state.drafts.get(key) || new Set();
  s.has(i) ? s.delete(i) : s.add(i);
  s.size ? state.drafts.set(key, s) : state.drafts.delete(key);
}
// placing someone settles their draft and rules out their row and column for everyone else
function settleDrafts(i, r, k) {
  for (const [key, s] of state.drafts) {
    const [a, b] = key.split(",").map(Number);
    s.delete(i);
    if (a === r || b === k) s.clear();
    if (!s.size) state.drafts.delete(key);
  }
}

function onCellClick(r, k, mark) {
  if (!state || state.solved) return;
  clearNotices();
  const b = state.board;
  const occupant = state.pos.findIndex(p => p && p[0] === r && p[1] === k);
  if (mark || state.markMode) {
    if (occupant >= 0 || b.blocking(r, k)) return;
    snapshot();
    const key = r + "," + k;
    state.marks.has(key) ? state.marks.delete(key) : state.marks.add(key);
    render(); return;
  }
  if (state.draftMode) {
    if (state.selected == null) { flashStatus("Choose a person to draft first.", "warn"); return; }
    if (occupant >= 0 || b.blocking(r, k)) return;
    snapshot(); toggleDraft(r + "," + k, state.selected); render(); return;
  }
  if (occupant >= 0 && (state.selected == null || state.selected === occupant)) {
    // pick the person back up
    snapshot(); state.pos[occupant] = null; state.selected = occupant; render(); return;
  }
  if (state.selected == null) { flashStatus("Choose a person first.", "warn"); return; }
  if (b.blocking(r, k)) { flashStatus("Nobody can stand there; it's furniture.", "warn"); return; }
  snapshot();
  if (occupant >= 0) state.pos[occupant] = null;
  state.pos[state.selected] = [r, k];
  state.marks.delete(r + "," + k);
  settleDrafts(state.selected, r, k);
  // move selection to the next unplaced person, a small convenience
  const next = state.people.findIndex((_, i) => !state.pos[i]);
  state.selected = next >= 0 ? next : null;
  render();
}

function undo() {
  const h = state.history.pop();
  if (!h) return;
  clearNotices();
  state.pos = h.pos; state.marks = h.marks; state.drafts = h.drafts; render();
}

function setMode(mode) {
  state.markMode = mode === "mark" && !state.markMode;
  state.draftMode = mode === "draft" && !state.draftMode;
  $("tool-mark").setAttribute("aria-pressed", state.markMode);
  $("tool-draft").setAttribute("aria-pressed", state.draftMode);
  render();
}
$("tool-mark").onclick = () => setMode("mark");
$("tool-draft").onclick = () => setMode("draft");
$("tool-submit").onclick = () => submitFindings();
$("tool-undo").onclick = () => undo();
$("tool-lens").onclick = () => { closeCasebook(); state.lens = !state.lens; if (state.lens) state.lensUses++; $("tool-lens").setAttribute("aria-pressed", state.lens); render(); };
$("tool-reset").onclick = () => {
  closeCasebook();
  openModal(`<h2>Start over?</h2><p>Everyone you have placed, and every draft mark and cross, will be cleared. A hint you have used stays used.</p>
    <div class="row"><button class="btn" data-no>Keep investigating</button><button class="btn primary" data-yes>Clear the board</button></div>`, m => {
    m.querySelector("[data-no]").onclick = closeModal;
    m.querySelector("[data-yes]").onclick = () => { snapshot(); state.pos = state.pos.map(() => null); state.marks.clear(); state.drafts.clear(); state.selected = 1; closeModal(); render(); };
  });
};
$("tool-briefing").onclick = () => { closeCasebook(); showBriefing(false); };
$("tool-how").onclick = () => { closeCasebook(); showHowTo(); };
// on a phone the button is a bare question mark, which reads as help, and a hint cannot be taken back
$("tool-hint").onclick = () => isPhone() ? askForHint() : hint();
$("tool-casebook").onclick = () => openCasebook();
$("casebook-close").onclick = () => closeCasebook();

document.addEventListener("keydown", e => {
  if (!$("game").classList.contains("active") || !state) return;
  if ($("modal-bg").classList.contains("open")) { if (e.key === "Escape" && !state.locked) closeModal(); return; }
  // the board is out of sight behind the Casebook, so its shortcuts must not reach it
  if (sheetOpen()) { if (e.key === "Escape") closeCasebook(); return; }
  if (/^[0-9]$/.test(e.key)) { const i = +e.key; if (i < state.people.length) select(i); }
  else if (e.key === "Escape") { state.selected = null; render(); }
  else if (/^[mx]$/i.test(e.key)) setMode("mark");
  else if (/^[dp]$/i.test(e.key)) setMode("draft");
  else if (e.key === "z" || e.key === "Z") undo();
  else if (e.key === "l" || e.key === "L") $("tool-lens").click();
  else if (e.key === "h" || e.key === "H") $("tool-hint").click();
});

let statusTimer = null;
// render() is the only writer of the status and statement lines; a message is held in state until it expires
function flashStatus(msg, kind, sticky) {
  state.flash = { msg, kind: kind || "" };
  $("announce").textContent = msg;
  clearTimeout(statusTimer);
  // on a phone the hint is the one message worth rereading, so it waits for the player's next move
  statusTimer = sticky && isPhone() ? null : setTimeout(() => { if (state) { state.flash = null; render(); } }, 3200);
  render();
}

// ---------------------------------------------------------------- evaluation
// Whether each placed person's own statement holds. Nothing here reaches the screen until the player accuses.
function evaluate() {
  const { board: b, pos, c } = state;
  const clueState = state.people.map(() => null);
  c.clues.forEach((cl, i) => {
    const p = pos[i]; if (!p) return;
    if (UNARY.has(cl.type)) clueState[i] = b.unaryOk(cl, p[0], p[1]);
    else { const q = pos[cl.other]; if (q) clueState[i] = b.binaryOk(cl, p, q); }
    if (clueState[i] === true && ONLY[cl.type] &&
        pos.some((q, j) => q && j !== i && b.unaryOk(cl, q[0], q[1]))) clueState[i] = false;
  });
  return { clueState };
}

function render() {
  if (!state) return;
  const { board: b, pos, people, cells, c } = state;
  const n = b.n;
  const claimedR = new Set(), claimedC = new Set();
  pos.forEach(p => { if (p) { claimedR.add(p[0]); claimedC.add(p[1]); } });
  const sel = state.selected;
  const lensClue = state.lens && sel != null && !state.solved ? c.clues[sel] : null;
  // once the case is over, every room but the victim's falls into shadow
  const scene = state.solved ? b.room(...c.solution[0]) : null;
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) {
    const d = cells[r][k];
    const taken = pos.some(p => p && p[0] === r && p[1] === k);
    d.querySelectorAll(".token, .mark, .drafts").forEach(x => x.remove());
    d.classList.toggle("claimed", !state.solved && (claimedR.has(r) || claimedC.has(k)) && !taken);
    let lit = false;
    if (lensClue && b.allowed(people[sel], r, k)) {
      if (UNARY.has(lensClue.type)) lit = b.unaryOk(lensClue, r, k);
      else { const q = pos[lensClue.other]; lit = q ? (q[0] !== r && q[1] !== k && b.binaryOk(lensClue, [r, k], q)) : true; }
    }
    d.classList.toggle("lens", lit);
    d.classList.toggle("lens-off", !!lensClue && !lit);
    d.classList.toggle("away", scene != null && b.room(r, k) !== scene);
    if (state.marks.has(r + "," + k)) d.appendChild(el("span", "mark", "×"));
    const ds = state.drafts.get(r + "," + k);
    if (ds && !taken) {
      const box = el("div", "drafts");
      [...ds].sort((a, b) => a - b).forEach(i =>
        box.appendChild(el("span", "draft" + (sel == null ? "" : sel === i ? " focus" : " dim"), initials(people[i].name))));
      d.appendChild(box);
    }
  }
  pos.forEach((p, i) => {
    if (!p) return;
    const t = el("div", "token" + (people[i].victim ? " victim" : "") + (sel === i ? " selected" : "") + (!state.solved && state.ringed?.includes(i) ? " flagged" : ""), initials(people[i].name));
    t.style.background = people[i].color;
    cells[p[0]][p[1]].appendChild(t);
  });
  state.cards.forEach((card, i) => {
    card.classList.toggle("selected", sel === i);
    card.classList.toggle("placed", !!pos[i]);
    const st = card.querySelector(".state");
    const placing = sel === i && !pos[i];
    st.textContent = pos[i] ? "Placed" : placing ? "Placing" : "–";
    st.className = "state" + (placing ? " placing" : "");
    const tb = state.trayBtns[i], p = people[i];
    tb.classList.toggle("selected", sel === i);
    tb.classList.toggle("placed", !!pos[i]);
    tb.setAttribute("aria-pressed", sel === i);
    tb.setAttribute("aria-label", `${p.name}, ${p.victim ? "the deceased" : p.role}, ${pos[i] ? "placed in " + roomRef(c.roomNames[b.room(...pos[i])]) : "not placed"}`);
  });
  const placed = pos.filter(Boolean).length;
  const count = `${placed} of ${people.length} placed`;
  $("placed-count").textContent = count;
  $("sheet-count").textContent = count;
  $("head-count").textContent = " · " + count;
  $("tool-submit").disabled = state.solved || placed < people.length;
  const over = state.solved ? (state.gaveUp ? "Case abandoned." : "Case closed.") : null;
  const ready = placed === people.length ? "Everyone is placed. Press Accuse when you are sure." : null;
  const f = state.flash;
  const kind = f && f.kind ? " " + f.kind : "";
  const s = $("status");
  s.className = "status" + kind;
  s.textContent = f ? f.msg : over || ready || (sel == null ? "Choose someone from the testimony."
    : state.draftMode ? `Drafting ${people[sel].short}. Draft marks are just for you.`
    : state.markMode ? "Crossing out. Tap a square to rule it out."
    : `Placing ${people[sel].short}. Tap a square to put them there.`);
  // the phone has no room for a status line: the selected person's statement sits here, and messages borrow the space
  const line = f ? f.msg : over || (sel != null ? c.clues[sel].text : ready || "Choose someone.");
  const st = $("statement");
  st.className = "statement" + kind;
  if (st.textContent !== line) st.textContent = line;
}

// ---------------------------------------------------------------- hints
// One hint per case: pressing Hint repeatedly would otherwise solve the board on its own.
const MAX_HINTS = 1;
function updateHintButton() {
  const spent = state.hints >= MAX_HINTS;
  $("tool-hint").disabled = spent;
  $("tool-hint").textContent = spent ? "Hint used" : "Hint";
  $("tool-hint").setAttribute("aria-label", spent ? "Hint used" : "Hint");
}
function spendHint() {
  state.hints++;
  store.setHintsUsed(state.day, state.c.tier, state.hints);
  updateHintButton();
}

function hint() {
  if (!state || state.solved) return;
  if (state.hints >= MAX_HINTS) { flashStatus("The Inspector has already given his one hint for this case.", "warn"); return; }
  const { c, pos, people } = state;
  // 1. point out a misplaced person
  const wrong = pos.findIndex((p, i) => p && (p[0] !== c.solution[i][0] || p[1] !== c.solution[i][1]));
  if (wrong >= 0) {
    spendHint();
    state.selected = wrong; render();
    flashStatus(`The Inspector taps the map: "${people[wrong].short} wasn't there. Look again."`, "warn", true);
    const [r, k] = pos[wrong]; state.cells[r][k].classList.add("hint-flash");
    setTimeout(() => state.cells[r][k].classList.remove("hint-flash"), 3000);
    return;
  }
  // 2. reveal the next person in logical deduction order
  const { order } = deduce(state.board, people, c.clues);
  const next = order.find(i => !pos[i]) ?? people.findIndex((_, i) => !pos[i]);
  if (next < 0) return;
  spendHint();
  snapshot();
  const [r, k] = c.solution[next];
  state.pos[next] = [r, k];
  state.marks.delete(r + "," + k);
  settleDrafts(next, r, k);
  state.selected = people.findIndex((_, i) => !state.pos[i]);
  if (state.selected < 0) state.selected = null;
  render();
  state.cells[r][k].classList.add("hint-flash");
  setTimeout(() => state.cells[r][k].classList.remove("hint-flash"), 3000);
  flashStatus(`The Inspector places ${people[next].short}.`, "good", true);
}

function askForHint() {
  if (!state || state.solved || state.hints >= MAX_HINTS) { hint(); return; }
  openModal(`
    <div class="kicker">One per case</div>
    <h2>Ask the Inspector?</h2>
    <p>He will give you one hint for this case, and only one.</p>
    <div class="row">
      <button class="btn" data-no>Not now</button>
      <button class="btn primary" data-yes>Ask</button>
    </div>`, m => {
    m.querySelector("[data-no]").onclick = closeModal;
    m.querySelector("[data-yes]").onclick = () => { closeModal(); hint(); };
  });
}

// ---------------------------------------------------------------- casebook (phone)
const sheetOpen = () => $("casebook").classList.contains("open");
function openCasebook() {
  if (!state || !isPhone()) return;
  const sheet = $("casebook");
  sheet.classList.add("open");
  sheet.setAttribute("role", "dialog"); sheet.setAttribute("aria-modal", "true");
  setBehindSheet(true);
  sheet.scrollTop = 0;
  $("casebook-close").focus();
}
function closeCasebook() {
  if (!sheetOpen()) return;
  const sheet = $("casebook");
  sheet.classList.remove("open");
  sheet.removeAttribute("role"); sheet.removeAttribute("aria-modal");
  setBehindSheet(false);
  $("tool-casebook").focus();
}
// the sheet lives inside the game screen, so its siblings are shut off rather than the screen itself
function setBehindSheet(hidden) {
  document.querySelectorAll("#game .topbar, #game .board-wrap").forEach(e => { e.inert = hidden; });
  document.body.classList.toggle("sheet-open", hidden);
}
// Lens, Briefing, How to play and Reset are single buttons: they live in the Casebook on a phone and in their old places otherwise
function placeControls() {
  if (isPhone()) {
    ["tool-lens", "tool-briefing", "tool-how", "tool-reset"].forEach(id => $("sheet-tools").appendChild($(id)));
  } else {
    $("tools").insertBefore($("tool-lens"), $("tool-hint"));
    ["tool-briefing", "tool-how", "tool-reset"].forEach(id => $("top-links").appendChild($(id)));
  }
}

// ---------------------------------------------------------------- completion & accusation
// What the Inspector objects to first: a shared line, a guest out of bounds, then a broken statement.
function findObjection() {
  const { board: b, pos, people, c } = state;
  const inRoom = i => roomRef(c.roomNames[b.room(...pos[i])]);
  for (let i = 0; i < people.length; i++) for (let j = i + 1; j < people.length; j++) {
    if (pos[i][0] === pos[j][0]) return { who: i, ring: [i, j], quote: "One person to every row.", detail: `${people[i].short} and ${people[j].short} are in the same row.` };
    if (pos[i][1] === pos[j][1]) return { who: i, ring: [i, j], quote: "One person to every column.", detail: `${people[i].short} and ${people[j].short} are in the same column.` };
  }
  for (let i = 0; i < people.length; i++) {
    if (!b.allowed(people[i], pos[i][0], pos[i][1])) {
      return { who: i, ring: [i], quote: c.twist ? c.twist.text : "Guests keep to their own rooms.", detail: `You've put ${people[i].short} in ${inRoom(i)}.` };
    }
  }
  const i = evaluate().clueState.indexOf(false);
  if (i < 0) return null;
  const cl = c.clues[i];
  // an ONLY or ALONE statement can be true of its speaker and still be broken by somebody else
  const rival = ONLY[cl.type] && b.unaryOk(cl, pos[i][0], pos[i][1]) ? pos.findIndex((q, j) => j !== i && b.unaryOk(cl, q[0], q[1])) : -1;
  return { who: i, ring: [rival >= 0 ? rival : i], quote: cl.text, detail: rival >= 0
    ? `You've put ${people[rival].short} in ${inRoom(rival)}, where the same would be true of them.`
    : `You've put ${people[i].short} in ${inRoom(i)}.` };
}

function submitFindings() {
  const { pos, c } = state;
  if (state.solved || pos.some(p => !p)) return;
  const objection = findObjection();
  const correct = !objection && pos.every((p, i) => p[0] === c.solution[i][0] && p[1] === c.solution[i][1]);
  if (!correct) { state.falseStarts++; rejectAccusation(objection); return; }
  state.locked = true;
  accuse();
}

function rejectAccusation(o) {
  const p = o ? state.people[o.who] : null;
  // with no square names to quote, the tokens in question are ringed on the board instead
  state.ringed = o ? o.ring : null;
  render();
  openModal(`
    <div class="kicker">Accusation rejected</div>
    <h2>Not quite, Inspector.</h2>
    ${o ? `<p>One witness would like a word.</p>
    <div class="objection"><span class="chip" style="background:${p.color}">${initials(p.name)}</span>
      <div><p class="quote">“${esc(o.quote)}”</p><p>${esc(o.detail)}</p></div></div>`
      : `<p>Somebody's story doesn't hold up.</p>`}
    <div class="row">
      <button class="btn primary" data-back>Back to the board</button>
      <button class="btn" data-reveal>Reveal the killer</button>
    </div>
    <p class="fine">The clock is still running. So, possibly, is the killer.</p>`, m => {
    m.querySelector("[data-back]").onclick = closeModal;
    m.querySelector("[data-reveal]").onclick = () => confirmGiveUp(() => rejectAccusation(o));
  });
}

function confirmGiveUp(onCancel) {
  openModal(`
    <div class="kicker">Close the file?</div>
    <h2>Give up this case?</h2>
    <p>The Inspector will show you where everyone was and who did it. Today's case will be recorded as given up, not solved.</p>
    <div class="row">
      <button class="btn" data-no>Keep investigating</button>
      <button class="btn primary" data-yes>Reveal the killer</button>
    </div>`, m => {
    m.querySelector("[data-no]").onclick = onCancel;
    m.querySelector("[data-yes]").onclick = giveUp;
  });
}

// a daily result is the first outcome; replaying a case never changes it
function recordResult(gaveUp) {
  const { c } = state;
  if (store.result(state.day, c.tier)) return;
  const result = { time: state.elapsed, hints: state.hints, lens: state.lensUses, wrong: state.wrongAccusations, falseStarts: state.falseStarts };
  if (gaveUp) result.gaveUp = true;
  store.record(state.day, c.tier, result);
}

function giveUp() {
  const { c } = state;
  state.pos = c.solution.map(p => [...p]);
  state.marks.clear(); state.drafts.clear();
  clearNotices();
  state.selected = null; state.lens = false;
  state.solved = true; state.gaveUp = true; state.locked = false;
  stopTimer();
  recordResult(true);
  render();
  showVerdict();
}

function accuse(msg) {
  const { c, people } = state;
  const scene = roomRef(c.roomNames[state.board.room(...c.solution[0])]);
  openModal(`
    <div class="kicker">Everyone is accounted for</div>
    <h2>J'accuse!</h2>
    <p>The body of ${esc(c.victim.name)} lay in <b>${esc(scene)}</b>. Who was alone with them?</p>
    ${msg ? `<p class="typed">${msg}</p>` : ""}
    <div class="accuse-list">${people.slice(1).map((p, j) =>
      `<button data-i="${j + 1}"><span class="chip" style="background:${p.color}">${initials(p.name)}</span>${esc(p.name)}</button>`).join("")}</div>`, m => {
    m.querySelectorAll("[data-i]").forEach(btn => btn.onclick = () => verdict(+btn.dataset.i));
  });
}

function verdict(i) {
  const { c, people } = state;
  if (i !== c.killer) {
    state.wrongAccusations++;
    const scene = state.board.room(...c.solution[0]);
    const where = roomRef(c.roomNames[state.board.room(...c.solution[i])]);
    accuse(`${esc(people[i].short)} was in ${esc(where)}, ${scene === state.board.room(...c.solution[i]) ? "but not alone" : "nowhere near the body"}. The Inspector clears their throat. Try again.`);
    return;
  }
  clearNotices();
  state.solved = true; state.locked = false; state.selected = null; state.lens = false;
  stopTimer();
  recordResult(false);
  render();
  showVerdict();
}

function showVerdict() {
  const { c, people } = state;
  const k = people[c.killer];
  const scene = roomRef(c.roomNames[state.board.room(...c.solution[0])]);
  const next = TIERS.find(t => !store.result(state.day, t.id));
  const role = k.role.replace(/^The\s+/i, "");
  openModal(`
    <div class="stamp-closed">${state.gaveUp ? "Case abandoned" : "Case closed"} · ${fmtTime(state.elapsed)}</div>
    <div class="kicker">${esc(c.title)} · Verdict</div>
    <h2 class="verdict-head">The ${esc(role[0].toLowerCase() + role.slice(1))} did it.</h2>
    <p>${esc(k.short)} was the only soul in ${esc(scene)} with ${esc(c.victim.short)}. <i>${esc(c.motives[c.killer - 1])}</i></p>
    <div class="stats">
      <div><b>${fmtTime(state.elapsed)}</b><span>Time</span></div>
      <div><b>${state.hints ? "Used" : "None"}</b><span>Hint</span></div>
      <div><b>${state.falseStarts + state.wrongAccusations}</b><span>False starts</span></div>
    </div>
    <div class="row">
      <button class="btn" data-files>All cases</button>
      ${next ? `<button class="btn primary" data-next>Next case: ${esc(next.label)} →</button>` : ""}
    </div>
    <p class="fine">${next ? "" : "That is every case for this day. "}Tomorrow's body arrives at midnight.</p>`, m => {
    m.querySelector("[data-files]").onclick = () => { closeModal(); backToDay(); };
    const nx = m.querySelector("[data-next]");
    if (nx) nx.onclick = () => { closeModal(); startCase(puzzleFor(next.id, state.day), state.day); };
  });
}

window.addEventListener("resize", () => {
  if (state && $("game").classList.contains("active") && cellSize(state.board.n) !== state.cellSize) { buildBoard(); render(); }
});
// crossing the phone width, by rotating for instance: an open Casebook would otherwise leave the page shut off
PHONE.addEventListener("change", () => {
  closeCasebook();
  placeControls();
  if (state && $("game").classList.contains("active")) { buildBoard(); render(); }
});
placeControls();
</script>
</body>
